<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload de Ficheiro</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Upload de Ficheiro</h1>
</header>

<div class="container">

    <h2>Enviar ficheiro Python</h2>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="arquivo"
            accept=".py"
            required
        >

        <button type="submit">
            Enviar Ficheiro
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}" class="voltar">
        ← Voltar ao Dashboard
    </a>

</div>

</body>
</html>
