<html>
<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ nome }} - Meu VS Code</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            color: #cccccc;
            font-family: Arial, sans-serif;
        }

        /* =========================
           BARRA SUPERIOR
        ========================= */

        .topbar {
            height: 48px;
            background: #181818;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            padding: 0 18px;
            color: #4ec9b0;
            font-weight: bold;
            font-size: 16px;
        }

        .arquivo {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #1e1e1e;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            color: white;
            overflow: hidden;
        }

        .arquivo strong {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .botoes {
            margin-left: auto;
            display: flex;
            gap: 5px;
            padding-right: 10px;
        }

        button {
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .salvar {
            background: #0e639c;
        }

        .salvar:hover {
            background: #1177bb;
        }

        .excluir {
            background: #8b1e1e;
        }

        .excluir:hover {
            background: #b91c1c;
        }

        .somente-leitura {
            background: #555;
            color: #ddd;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* =========================
           EDITOR
        ========================= */

        #editor {
            position: absolute;
            top: 48px;
            bottom: 25px;
            left: 0;
            right: 0;
        }

        /* =========================
           STATUS BAR
        ========================= */

        .statusbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 25px;
            background: #007acc;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
        }

        .status-right {
            margin-left: auto;
        }

        /* =========================
           MENSAGEM
        ========================= */

        #mensagem {
            position: fixed;
            right: 20px;
            bottom: 45px;
            background: #252526;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            display: none;
            box-shadow: 0 4px 15px black;
        }

        @media (max-width: 700px) {

            .logo {
                display: none;
            }

            .arquivo {
                flex: 1;
                min-width: 0;
            }

            .botoes {
                padding-right: 5px;
            }

            .botoes button {
                padding: 6px 8px;
            }

            .botoes button:nth-child(2) {
                display: none;
            }

            .somente-leitura {
                font-size: 11px;
                padding: 6px 8px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     BARRA SUPERIOR
========================= -->

<div class="topbar">

    <div class="logo">
        VS CODE
    </div>


    <div class="arquivo">

        🐍 &nbsp;

        <strong>
            {{ nome }}
        </strong>

    </div>


    <div class="botoes">

        {% if admin %}

            <button onclick="novoArquivo()">
                + Novo
            </button>

            <button onclick="pesquisar()">
                🔍 Pesquisar
            </button>

            <button
                class="salvar"
                onclick="salvar()"
            >
                💾 Salvar
            </button>

            <button
                class="excluir"
                onclick="excluirArquivo()"
            >
                🗑 Excluir
            </button>

        {% else %}

            <span class="somente-leitura">
                👤 Somente visualização
            </span>

        {% endif %}


        <button onclick="voltar()">
            ← Voltar
        </button>

    </div>

</div>


<!-- =========================
     EDITOR
========================= -->

<div id="editor"></div>


<!-- =========================
     STATUS
========================= -->

<div class="statusbar">

    <span>
        Python
    </span>

    <span class="status-right">

        UTF-8 &nbsp; | &nbsp; LF

        {% if admin %}

            &nbsp; | &nbsp; 👑 Administrador

        {% else %}

            &nbsp; | &nbsp; 👤 Somente leitura

        {% endif %}

    </span>

</div>


<div id="mensagem">
    Alterações salvas
</div>


<!-- =========================
     MONACO EDITOR
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>


<script>

require.config({

    paths: {

        vs:
        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"

    }

});


let editor;


require(
    ["vs/editor/editor.main"],

    function () {

        editor = monaco.editor.create(

            document.getElementById("editor"),

            {

                value:
                {{ conteudo | tojson }},

                language: "python",

                theme: "vs-dark",

                automaticLayout: true,

                fontSize: 15,

                minimap: {
                    enabled: true
                },

                lineNumbers: "on",

                roundedSelection: false,

                scrollBeyondLastLine: false,

                wordWrap: "off",

                tabSize: 4,

                insertSpaces: true,

                suggestOnTriggerCharacters: true,

                quickSuggestions: true,

                parameterHints: {
                    enabled: true
                },

                folding: true,

                bracketPairColorization: {
                    enabled: true
                },

                readOnly:
                {{ "false" if admin else "true" }}

            }

        );

    }

);


// =========================
// SALVAR
// SOMENTE ADMIN
// =========================

function salvar() {

    {% if not admin %}

        alert(
            "Apenas o administrador pode editar ficheiros."
        );

        return;

    {% endif %}


    if (!editor) {
        return;
    }


    const codigo =
        editor.getValue();


    const formulario =
        document.createElement("form");


    formulario.method = "POST";


    formulario.action =
        "{{ url_for('editar', nome=nome) }}";


    const campo =
        document.createElement("textarea");


    campo.name = "conteudo";


    campo.value = codigo;


    formulario.appendChild(campo);


    document.body.appendChild(formulario);


    formulario.submit();

}


// =========================
// CTRL + S
// =========================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            (event.ctrlKey || event.metaKey)
            &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            salvar();

        }

    }
);


// =========================
// PESQUISAR
// =========================

function pesquisar() {

    if (!editor) {
        return;
    }

    editor.getAction(
        "actions.find"
    ).run();

}


// =========================
// NOVO ARQUIVO
// SOMENTE ADMIN
// =========================

function novoArquivo() {

    {% if not admin %}

        alert(
            "Apenas o administrador pode criar ficheiros."
        );

        return;

    {% endif %}


    window.location.href =
        "{{ url_for('novo_arquivo') }}";

}


// =========================
// EXCLUIR
// SOMENTE ADMIN
// =========================

function excluirArquivo() {

    {% if not admin %}

        alert(
            "Apenas o administrador pode excluir ficheiros."
        );

        return;

    {% endif %}


    const confirmar =
        confirm(
            "Tem certeza que deseja excluir {{ nome }}?"
        );


    if (!confirmar) {
        return;
    }


    const formulario =
        document.createElement("form");


    formulario.method = "POST";


    formulario.action =
        "{{ url_for('excluir', nome=nome) }}";


    document.body.appendChild(formulario);


    formulario.submit();

}


// =========================
// VOLTAR
// =========================

function voltar() {

    window.location.href =
        "{{ url_for('arquivos') }}";

}

</script>


</body>
</html>
